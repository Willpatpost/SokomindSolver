    <title>Sokomind — Thoughtful box puzzles</title>

  <body>
    <script>
(function() {
  try {
    var root = document.documentElement;
    var raw = localStorage.getItem("sokomind.experience.v1");
    var prefs = raw ? JSON.parse(raw) : {};
    var motion = prefs.motion;
    if (motion === "full" || motion === "reduced") {
      root.dataset.motion = motion;
    } else if (motion === "system" || !motion) {
      root.dataset.motion = window.matchMedia("(prefers-reduced-motion: reduce)").matches
        ? "reduced"
        : "full";
    }
    if (raw) {
      var theme = prefs.theme;
      if (theme === "dark" || theme === "light") {
        root.dataset.theme = theme;
      } else if (theme === "system" || !theme) {
        if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
          root.dataset.theme = "dark";
        }
      }
    } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
      root.dataset.theme = "dark";
    }
  } catch(e) {}
})();
</script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
