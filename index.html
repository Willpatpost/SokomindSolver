    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Sokomind",
      "description": "A large collection of thoughtful Sokoban puzzles in a calm, animated play space.",
      "applicationCategory": "GameApplication",
      "operatingSystem": "Any",
      "browserRequirements": "Requires JavaScript",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
  </head>
  <body>
    <script>
(function() {
  try {
    var root = document.documentElement;
    var raw = localStorage.getItem("sokomind.experience.v2") ||
      localStorage.getItem("sokomind.experience.v1");
    var prefs = raw ? JSON.parse(raw) : {};
    var motion = prefs.motion;
    if (motion === "full" || motion === "reduced") {
      root.dataset.motion = motion;
    } else if (motion === "system" || !motion) {
      root.dataset.motion = window.matchMedia("(prefers-reduced-motion: reduce)").matches
        ? "reduced"
        : "full";
    }
    var families = ["cozy-study", "midnight-neon", "minimal-ink"];
    var family = prefs.version === 2 && families.indexOf(prefs.themeFamily) >= 0
      ? prefs.themeFamily
      : "cozy-study";
    var appearance = prefs.version === 2 ? prefs.appearance : prefs.theme;
    var resolvedTheme = appearance === "dark" || appearance === "light"
      ? appearance
      : window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light";
    root.dataset.themeFamily = family;
    root.dataset.theme = resolvedTheme;
    var themeColors = {
      "cozy-study": { light: "#f3f0e7", dark: "#171916" },
      "midnight-neon": { light: "#eef2ff", dark: "#080b18" },
      "minimal-ink": { light: "#f6f6f3", dark: "#111212" }
    };
    var tcs = document.querySelectorAll('meta[name="theme-color"]');
    var val = themeColors[family][resolvedTheme];
    tcs.forEach(function(tc) { tc.setAttribute("content", val); });
  } catch(e) {}
})();
</script>
    <noscript>

        </div>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
