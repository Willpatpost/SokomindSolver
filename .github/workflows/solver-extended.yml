name: Extended Solver Proof

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * 1"

permissions:
  contents: read

concurrency:
  group: solver-extended-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-optimum:
    name: Extended frozen optimum
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # This fixture is deliberately separate from PR latency: it currently
      # takes roughly 2.5 minutes on the audit workstation.
      - name: Prove the extended frozen optimum
        run: npm run test:solver:known:extended
