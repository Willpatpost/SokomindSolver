version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: America/New_York
    open-pull-requests-limit: 10
    groups:
      react-family:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - patch
          - minor
      lint-and-typescript:
        patterns:
          - typescript
          - typescript-eslint
          - eslint
          - "@eslint/*"
          - "eslint-*"
        update-types:
          - patch
          - minor
      development-dependencies:
        dependency-type: development
        update-types:
          - patch
          - minor
    # Major upgrades remain individual PRs so their migrations and browser
    # compatibility can be reviewed deliberately instead of being hidden by a
    # blanket ignore rule.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:30"
      timezone: America/New_York
